name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: 'release'

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Create Release PR and Tag
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun environment
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          app-id: ${{ secrets.CHANGESETS_APP_ID }}
          private-key: ${{ secrets.CHANGESETS_PRIVATE_KEY }}

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v2.1.2
        with:
          version-script: bun run version
          publish-script: bun run release
          create-github-releases: true
          github-token: ${{ steps.app-token.outputs.token }}
          pr-title: "release: version packages"
          commit-message: "release: version packages"

      - name: Set version in release PR title
        if: steps.changesets.outputs.hasChangesets == 'true'
        run: gh pr edit "${{ steps.changesets.outputs.pullRequestNumber }}" --title "release: v$(jq -r .version package.json)"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Enable auto-merge on release PR
        if: steps.changesets.outputs.hasChangesets == 'true'
        run: gh pr merge "${{ steps.changesets.outputs.pullRequestNumber }}" --auto --squash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
