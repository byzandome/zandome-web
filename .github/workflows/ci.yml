name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

concurrency:
  group: 'ci-${{ github.ref }}'
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changeset:
    name: Check Changeset
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref != 'changeset-release/main'
    continue-on-error: true
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Bun environment
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check for Changesets
        run: |
          if ! bun run changeset status --since origin/main; then
            echo "⚠️  No changesets found. Please add a changeset with: bun run changeset"
            exit 1
          fi

  lint:
    name: Lint and Format
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1
      - name: Setup Bun environment
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify Format
        run: |
          bun run format:ci
      - name: Run Lint
        run: |
          bun run lint:ci
      - name: Type Check
        run: |
          bun run typecheck

  build:
    name: Build
    if: github.head_ref != 'changeset-release/main'
    timeout-minutes: 5
    needs: [lint]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1
      - name: Setup Bun environment
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run Build
        run: bun run build
