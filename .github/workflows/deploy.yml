name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: 'pages-${{ github.ref }}'
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build with Docker
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0

      - name: Build Docker image (builder stage)
        run: |
          docker build --target builder \
            --build-arg ANALYTICS_GOOGLE_ID=${{ secrets.ANALYTICS_GOOGLE_ID }} \
            -t zandome-web-builder .

      - name: Extract dist from Docker image
        run: |
          docker create --name extract zandome-web-builder
          docker cp extract:/app/dist ./dist
          docker rm extract

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
